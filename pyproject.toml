[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "openharness"
version = "0.4.0"
description = "A production-grade Python harness for LLM agents — Claude-Code-style tool loop with sandboxing, hooks, plugins, and multi-turn REPL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "maisieyang", email = "yangxiyuebupt@gmail.com" },
]
keywords = [
    "llm",
    "agent",
    "harness",
    "ai",
    "anthropic",
    "claude",
    "openai",
    "qwen",
    "tool-use",
    "sandbox",
    "mcp",
    "model-context-protocol",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5",
    # P1-T3 sub-unit 3c.2 — openai SDK powers OpenAICompatibleApiClient
    # against any OpenAI-compatible endpoint (Qwen via DashScope is the
    # Phase 1 test target). See decisions/03-api-client-strategy.md.
    "openai>=1.50,<2.0",
    # P1-T4 sub-unit 4a — Settings layer reads OPENHARNESS_* env vars + .env
    # files. See decisions/05-cli.md (D5.2).
    "pydantic-settings>=2.1",
    # Phase 1 will add: typer, rich
    "typer>=0.12,<1.0",
    "structlog>=25.5.0",
    "tiktoken>=0.12.0",
    "mcp>=1.2.0",
    # P5c-T1 — Skills frontmatter parsing. YAML is the industry-standard
    # frontmatter format (Claude Code / Jekyll / Hugo / etc.); rolling our
    # own parser would break on multi-line strings, lists, and edge cases
    # users will hit. ``yaml.safe_load`` is the small, correct primitive.
    "pyyaml>=6.0",
    # P7b-T1 — Docker substrate (SandboxExecution). aiodocker is the
    # async-native Docker Engine SDK; matches the existing await
    # `env.run_command(...)` shape without thread-pool wrapping. Pinned
    # below 1.0 since aiodocker is still pre-1.0; bumping is a Phase 8+
    # task. See decisions/16 D18.1.
    "aiodocker>=0.21,<1.0",
    # P14-T1 (D29.5) — WebFetch tool's HTML → markdown converter.
    # Pure Python, ~30KB, actively maintained; LangChain / LlamaIndex
    # use the same lib. stdlib html.parser is too primitive for clean
    # markdown output, and html2text is ~70KB without a corresponding
    # quality jump for our use case. httpx is already in the dep tree
    # via openai SDK so no separate HTTP dep is needed.
    "markdownify>=0.11,<1.0",
    # P14-T3 — explicit dep on BeautifulSoup4 (already pulled
    # transitively by markdownify). WebFetch uses bs4's public API
    # directly for the chrome-stripping pre-pass (script / style /
    # nav / aside / header / footer get decompose()'d so their inner
    # text vanishes — markdownify's ``strip=[...]`` only drops the
    # wrapping tag, keeping inner text the LLM does not want to see).
    "beautifulsoup4>=4.12,<5.0",
    # repl-ux plan §2 — interactive ``oh chat`` input layer: ``/``
    # completion menu, per-project persistent history, status toolbar.
    # prompt_toolkit's own line editor handles CJK/ASCII mixed-script
    # width correctly, which retired the Phase 14.5 gnureadline
    # workaround (libedit cursor-math bug) and the readline
    # side-effect imports that carried it.
    "prompt-toolkit>=3.0.52",
]

[project.scripts]
oh = "openharness.cli:main"

[project.urls]
Homepage = "https://github.com/maisieyang/build-my-own-harness"
Repository = "https://github.com/maisieyang/build-my-own-harness"
Documentation = "https://github.com/maisieyang/build-my-own-harness/blob/main/README.md"
Changelog = "https://github.com/maisieyang/build-my-own-harness/blob/main/CHANGELOG.md"
Issues = "https://github.com/maisieyang/build-my-own-harness/issues"
"Development log" = "https://github.com/maisieyang/build-my-own-harness/blob/main/docs/development-log.md"

# PEP 735 dependency groups — recognized by uv natively
[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    # P5c-T1 — type stubs for PyYAML; mypy --strict won't pass without them
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openharness"]

# ---------------------------------------------------------------------------
# Ruff — lint + format (replaces flake8 + black + isort + pyupgrade)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade (auto-modernize syntax)
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line too long — handled by formatter
]

# Typer's `param: T = typer.Option(...)` is the framework's intended pattern —
# Option() returns a sentinel object, not a real default. Same reasoning as
# fastapi.Depends / fastapi.Query which ruff ships with built-in exemptions.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG",  # fixtures often look unused but aren't
]

# Pydantic v2 evaluates type annotations at runtime to build schemas, so type-only
# imports referenced in fields must NOT be moved into ``if TYPE_CHECKING:`` blocks.
# Listing the base classes here teaches the TCH rule to leave their subclasses alone.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "openharness.protocols._base.StrictModel",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy — strict type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
show_column_numbers = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

# P7b-T1 — aiodocker has no type stubs (pre-1.0 library). Treat its
# imports as untyped so mypy --strict doesn't fail on every aiodocker
# usage. ``follow_imports = "skip"`` additionally prevents mypy from
# trying to analyze aiodocker's internals (mypy 2.0.0 crashes on
# aiodocker's jsonstream.py — upstream bug; skipping sidesteps it).
# SandboxExecution wraps it in our own typed Protocol
# (ExecutionEnvironment from P7a), so the untyped surface is bounded.
[[tool.mypy.overrides]]
module = "aiodocker.*"
ignore_missing_imports = true
follow_imports = "skip"

# Pydantic mypy plugin — enforce stricter Pydantic patterns
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=openharness",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
# Custom markers — listed here so ``--strict-markers`` does not flag them.
# ``integration`` and dataset ``eval`` gates are opt-in. CI runs only the
# deterministic unit substrate; both manual surfaces have explicit commands.
markers = [
    "integration: real-API end-to-end test (opt-in via -m integration)",
    "eval: dataset-backed cassette replay gate (manual via -m eval)",
]

[tool.coverage.run]
source = ["src/openharness"]
branch = true
# eval/ is an experimental subsystem (the eval substrate + its two
# consumers) — still stabilizing, intentionally not yet under the coverage
# gate. Excluded so the gate reflects the stable core; revisit when eval
# graduates from experimental.
omit = [
    "src/openharness/eval/*",
    # swebench/ is the benchmark adapter (decisions/40 D40.1) — same
    # experimental posture as eval/: tests run in CI, excluded from the
    # stable-core coverage gate until it graduates.
    "src/openharness/swebench/*",
]

[tool.coverage.report]
# Gate covers the STABLE CORE. The experimental eval subsystem is excluded:
# the eval/ package via [tool.coverage.run] omit, and the `oh eval` CLI
# commands in cli.py via ``# pragma: no cover``. With eval carved out the
# core holds ≥95%. Re-include eval and re-affirm 95 once it graduates from
# experimental.
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
