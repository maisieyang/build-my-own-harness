[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "openharness"
version = "0.0.1"
description = "A production-grade Python harness for LLM agents — built from scratch as a learning project"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "yangxiyue", email = "yangxiyuebupt@gmail.com" },
]
keywords = ["llm", "agent", "harness", "ai", "claude", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.5",
    # P1-T3 sub-unit 3c.2 — openai SDK powers OpenAICompatibleApiClient
    # against any OpenAI-compatible endpoint (Qwen via DashScope is the
    # Phase 1 test target). See decisions/03-api-client-strategy.md.
    "openai>=1.50,<2.0",
    # P1-T4 sub-unit 4a — Settings layer reads OPENHARNESS_* env vars + .env
    # files. See decisions/05-cli.md (D5.2).
    "pydantic-settings>=2.1",
    # Phase 1 will add: typer, rich
    "typer>=0.12,<1.0",
    "structlog>=25.5.0",
    "tiktoken>=0.12.0",
    "mcp>=1.2.0",
    # P5c-T1 — Skills frontmatter parsing. YAML is the industry-standard
    # frontmatter format (Claude Code / Jekyll / Hugo / etc.); rolling our
    # own parser would break on multi-line strings, lists, and edge cases
    # users will hit. ``yaml.safe_load`` is the small, correct primitive.
    "pyyaml>=6.0",
    # P7b-T1 — Docker substrate (SandboxExecution). aiodocker is the
    # async-native Docker Engine SDK; matches the existing await
    # `env.run_command(...)` shape without thread-pool wrapping. Pinned
    # below 1.0 since aiodocker is still pre-1.0; bumping is a Phase 8+
    # task. See decisions/16 D18.1.
    "aiodocker>=0.21,<1.0",
]

[project.scripts]
oh = "openharness.cli:main"
openharness = "openharness.cli:main"

[project.urls]
Homepage = "https://github.com/maisieyang/build-my-own-harness"
Documentation = "https://github.com/maisieyang/build-my-own-harness/blob/main/ARCHITECTURE.md"
Issues = "https://github.com/maisieyang/build-my-own-harness/issues"

# PEP 735 dependency groups — recognized by uv natively
[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    # P5c-T1 — type stubs for PyYAML; mypy --strict won't pass without them
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openharness"]

# ---------------------------------------------------------------------------
# Ruff — lint + format (replaces flake8 + black + isort + pyupgrade)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade (auto-modernize syntax)
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line too long — handled by formatter
]

# Typer's `param: T = typer.Option(...)` is the framework's intended pattern —
# Option() returns a sentinel object, not a real default. Same reasoning as
# fastapi.Depends / fastapi.Query which ruff ships with built-in exemptions.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG",  # fixtures often look unused but aren't
]

# Pydantic v2 evaluates type annotations at runtime to build schemas, so type-only
# imports referenced in fields must NOT be moved into ``if TYPE_CHECKING:`` blocks.
# Listing the base classes here teaches the TCH rule to leave their subclasses alone.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "openharness.protocols._base.StrictModel",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy — strict type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
show_column_numbers = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

# P7b-T1 — aiodocker has no type stubs (pre-1.0 library). Treat its
# imports as untyped so mypy --strict doesn't fail on every aiodocker
# usage. ``follow_imports = "skip"`` additionally prevents mypy from
# trying to analyze aiodocker's internals (mypy 2.0.0 crashes on
# aiodocker's jsonstream.py — upstream bug; skipping sidesteps it).
# SandboxExecution wraps it in our own typed Protocol
# (ExecutionEnvironment from P7a), so the untyped surface is bounded.
[[tool.mypy.overrides]]
module = "aiodocker.*"
ignore_missing_imports = true
follow_imports = "skip"

# Pydantic mypy plugin — enforce stricter Pydantic patterns
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=openharness",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
# Custom markers — listed here so ``--strict-markers`` does not flag them.
# ``integration`` is opt-in; CI runs ``pytest -m "not integration"`` and
# nightly / on-demand runs ``pytest -m integration`` (with the API-key env
# var set as a secret). See decisions/05-cli.md D5.7.
markers = [
    "integration: real-API end-to-end test (opt-in via -m integration)",
]

[tool.coverage.run]
source = ["src/openharness"]
branch = true
# __main__.py is the `python -m openharness` entry shim — 3 lines of
# imports + `main()` call. Not unit-testable; the integration path is
# already covered by tests/cli/test_cli.py invoking the Typer app.
omit = ["src/openharness/__main__.py"]

[tool.coverage.report]
# P3-T6.6b: raised from Phase 1 / 2's 70% baseline. With Observability +
# AuthZ Tiers + Hook system all landed and tested, the gate moves to 95%
# total. Per-module audit ran at this commit shows every module above 92%;
# the gate stays global because per-module Coverage.py support is brittle
# and most low values (Protocol method `...` bodies, abstract method
# signatures) are non-issues addressed with ``# pragma: no cover``.
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
