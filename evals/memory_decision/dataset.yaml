# memory_decision eval dataset — decision surface #4 (inline decision)
#
# 6 capability-anchored samples probing the LLM's typed durable-memory
# decision:
#
#   user msg → (production typed-memory rules + generated index)
#            → model emits MemoryUpsert, OR correctly skips when
#              input is not memory-worthy.
#
# See dataset_card.md for the three-claim header (D35.3) + per-shape
# fixture rationale + per-rubric coverage.
#
# Schema:
#   openharness.eval.memory_decision.load_memory_decision_dataset()
#   parses this into list[MemoryDecisionSample].
#
# Shape distribution: 2 cold-start + 3 warm-start + 1 trivial-skip
# (per Phase 16 plan T3 acceptance "≥6 scenarios: 2 cold + 3 warm + 1
# trivial-skip"). Warm-start scenarios are the discriminating ones —
# the 2026-06-05 spike showed cold-start gets ~80% PASS on both
# qwen-plus and qwen3.7-max while warm-start is where the contract
# stresses.

samples:

  # ===== M1 — Cold-start: preference =====
  - case_id: M1-cold-preference
    capability: M-judge-preference
    shape: cold-start
    user_msg: |
      I prefer terse responses without trailing summaries — just show me the diff.
    expect_write: true
    expected_memory_type: feedback
    pre_populated_files: {}
    notes: |
      Stable user preference, cold-start. Model should call
      MemoryUpsert with a complete typed payload. Type is defensible as
      ``user`` OR ``feedback`` per rubric (taxonomy overlap region).

  # ===== M2 — Cold-start: project state =====
  - case_id: M2-cold-project-state
    capability: M-judge-project
    shape: cold-start
    user_msg: |
      We're freezing all non-critical merges after 2026-06-11 (next Thursday) — mobile team is cutting a release branch.
    expect_write: true
    expected_memory_type: project
    pre_populated_files: {}
    notes: |
      Project state with explicit absolute date + reason, cold-start.
      Rubric: type MUST be ``project`` — user / feedback / reference
      are category errors here. The absolute date is given inline so
      the system prompt's "convert relative dates to absolute" rule
      doesn't trigger a clarification request that masks the write
      decision (v1 of this sample used "after Thursday" without the
      absolute anchor; qwen3.7-max correctly asked for the date
      instead of writing, which made the result unattributable
      between dataset bug and model failure).

  # ===== M3 — Warm-start: correction =====
  - case_id: M3-warm-correction
    capability: M-judge-correction
    shape: warm-start
    user_msg: |
      Actually we use Tavily for web search, not SerpAPI. SerpAPI is too expensive at our scale.
    expect_write: true
    expected_memory_type: feedback
    pre_populated_files:
      code-style-line-width.md: |
        ---
        name: code-style-line-width
        description: Wrap code at 80 characters
        metadata:
          type: feedback
        ---

        Wrap code at 80 characters max.
      test-runner-command.md: |
        ---
        name: test-runner-command
        description: Tests run via uv run pytest -q
        metadata:
          type: project
        ---

        Tests run via uv run pytest -q, not python -m pytest.
      linear-build-tracking.md: |
        ---
        name: linear-build-tracking
        description: Infra bugs in Linear project BUILD
        metadata:
          type: reference
        ---

        Infra bugs go in Linear project BUILD.
    notes: |
      Warm-start with three existing records. The typed operation must
      add the correction without dropping any seed; the harness owns
      index regeneration.

  # ===== M4 — Warm-start: reference =====
  - case_id: M4-warm-reference
    capability: M-judge-reference
    shape: warm-start
    user_msg: |
      Pipeline bugs go in the Linear project INGEST.
    expect_write: true
    expected_memory_type: reference
    pre_populated_files:
      code-style-line-width.md: |
        ---
        name: code-style-line-width
        description: Wrap code at 80 characters
        metadata:
          type: feedback
        ---

        Wrap code at 80 characters max.
      test-runner-command.md: |
        ---
        name: test-runner-command
        description: Tests run via uv run pytest -q
        metadata:
          type: project
        ---

        Tests run via uv run pytest -q, not python -m pytest.
      linear-build-tracking.md: |
        ---
        name: linear-build-tracking
        description: Infra bugs in Linear project BUILD
        metadata:
          type: reference
        ---

        Infra bugs go in Linear project BUILD.
    notes: |
      Warm-start, reference type. Note: a similarly-shaped reference
      memory (Linear BUILD project) is ALREADY indexed. Model should
      recognize the difference (INGEST ≠ BUILD) and add a new entry
      rather than incorrectly assuming the existing one covers it.

  # ===== M5 — Warm-start: preference =====
  - case_id: M5-warm-preference
    capability: M-judge-preference
    shape: warm-start
    user_msg: |
      I prefer code reviews that quote the exact diff instead of summarizing it.
    expect_write: true
    expected_memory_type: feedback
    pre_populated_files:
      code-style-line-width.md: |
        ---
        name: code-style-line-width
        description: Wrap code at 80 characters
        metadata:
          type: feedback
        ---

        Wrap code at 80 characters max.
      test-runner-command.md: |
        ---
        name: test-runner-command
        description: Tests run via uv run pytest -q
        metadata:
          type: project
        ---

        Tests run via uv run pytest -q, not python -m pytest.
      linear-build-tracking.md: |
        ---
        name: linear-build-tracking
        description: Infra bugs in Linear project BUILD
        metadata:
          type: reference
        ---

        Infra bugs go in Linear project BUILD.
    notes: |
      Warm-start preference. Cross-checks M1's cold-start preference
      against the same semantic decision with existing records.

  # ===== M6 — Trivial skip (no write expected) =====
  - case_id: M6-trivial-skip
    capability: M-trivial-skip
    shape: trivial-skip
    user_msg: |
      What's 2 + 2?
    expect_write: false
    expected_memory_type: null
    pre_populated_files:
      code-style-line-width.md: |
        ---
        name: code-style-line-width
        description: Wrap code at 80 characters
        metadata:
          type: feedback
        ---

        Wrap code at 80 characters max.
    notes: |
      Trivial ephemeral question — should NOT trigger MemoryUpsert.
      The warm fixture makes the catalog available, but the correct
      behavior is to answer without changing durable memory.
